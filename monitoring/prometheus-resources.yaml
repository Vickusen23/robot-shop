apiVersion: v1
items:
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      meta.helm.sh/release-name: prometheus
      meta.helm.sh/release-namespace: default
    creationTimestamp: "2026-10-27T12:10:12Z"
    generation: 1
    labels:
      app: kube-prometheus-stack
      app.kubernetes.io/instance: prometheus
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/part-of: kube-prometheus-stack
      app.kubernetes.io/version: 92.14.0
      chart: kube-prometheus-stack-92.14.0
      heritage: Helm
      release: prometheus
    name: prometheus-kube-prometheus-alertmanager.rules
    namespace: default
    resourceVersion: "413032"
    uid: 6849c959-6348-4903-8eb9-314af64cd68a
  spec:
    groups:
    - name: alertmanager.rules
      rules:
      - alert: AlertmanagerFailedReload
        annotations:
          description: Configuration has failed to load for {{ $labels.namespace }}/{{
            $labels.pod}}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerfailedreload
          summary: Reloading an Alertmanager configuration has failed.
        expr: |-
          # Without max_over_time, failed scrapes could create false negatives, see
          # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
          max_over_time(alertmanager_config_last_reload_successful{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"}[5m]) == 0
        for: 10m
        labels:
          severity: critical
      - alert: AlertmanagerMembersInconsistent
        annotations:
          description: Alertmanager {{ $labels.namespace }}/{{ $labels.pod}} has only
            found {{ $value }} members of the {{$labels.job}} cluster.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagermembersinconsistent
          summary: A member of an Alertmanager cluster has not found all other cluster
            members.
        expr: |-
          # Without max_over_time, failed scrapes could create false negatives, see
          # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
            max_over_time(alertmanager_cluster_members{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"}[5m])
          < on (namespace,service,cluster) group_left
            count by (namespace,service,cluster) (max_over_time(alertmanager_cluster_members{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"}[5m]))
        for: 15m
        labels:
          severity: critical
      - alert: AlertmanagerFailedToSendAlerts
        annotations:
          description: Alertmanager {{ $labels.namespace }}/{{ $labels.pod}} failed
            to send {{ $value | humanizePercentage }} of notifications to {{ $labels.integration
            }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerfailedtosendalerts
          summary: An Alertmanager instance failed to send notifications.
        expr: |-
          (
            rate(alertmanager_notifications_failed_total{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"}[15m])
          /
            ignoring (reason) group_left rate(alertmanager_notifications_total{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"}[15m])
          )
          > 0.01
        for: 5m
        labels:
          severity: warning
      - alert: AlertmanagerClusterFailedToSendAlerts
        annotations:
          description: The minimum notification failure rate to {{ $labels.integration
            }} sent from any instance in the {{$labels.job}} cluster is {{ $value
            | humanizePercentage }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclusterfailedtosendalerts
          summary: All Alertmanager instances in a cluster failed to send notifications
            to a critical integration.
        expr: |-
          min by (namespace,service, integration) (
            rate(alertmanager_notifications_failed_total{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default", integration=~`.*`}[15m])
          /
            ignoring (reason) group_left rate(alertmanager_notifications_total{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default", integration=~`.*`}[15m]) > 0
          )
          > 0.01
        for: 5m
        labels:
          severity: critical
      - alert: AlertmanagerClusterFailedToSendAlerts
        annotations:
          description: The minimum notification failure rate to {{ $labels.integration
            }} sent from any instance in the {{$labels.job}} cluster is {{ $value
            | humanizePercentage }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclusterfailedtosendalerts
          summary: All Alertmanager instances in a cluster failed to send notifications
            to a non-critical integration.
        expr: |-
          min by (namespace,service, integration) (
            rate(alertmanager_notifications_failed_total{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default", integration!~`.*`}[15m])
          /
            ignoring (reason) group_left rate(alertmanager_notifications_total{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default", integration!~`.*`}[15m]) > 0
          )
          > 0.01
        for: 5m
        labels:
          severity: warning
      - alert: AlertmanagerConfigInconsistent
        annotations:
          description: Alertmanager instances within the {{$labels.job}} cluster have
            different configurations.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerconfiginconsistent
          summary: Alertmanager instances within the same cluster have different configurations.
        expr: |-
          count by (namespace,service,cluster) (
            count_values by (namespace,service,cluster) ("config_hash", alertmanager_config_hash{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"})
          )
          != 1
        for: 20m
        labels:
          severity: critical
      - alert: AlertmanagerClusterDown
        annotations:
          description: '{{ $value | humanizePercentage }} of Alertmanager instances
            within the {{$labels.job}} cluster have been up for less than half of
            the last 5m.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclusterdown
          summary: Half or more of the Alertmanager instances within the same cluster
            are down.
        expr: |-
          (
            count by (namespace,service,cluster) (
              avg_over_time(up{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"}[5m]) < 0.5
            )
          /
            count by (namespace,service,cluster) (
              up{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"}
            )
          )
          >= 0.5
        for: 5m
        labels:
          severity: critical
      - alert: AlertmanagerClusterCrashlooping
        annotations:
          description: '{{ $value | humanizePercentage }} of Alertmanager instances
            within the {{$labels.job}} cluster have restarted at least 5 times in
            the last 10m.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclustercrashlooping
          summary: Half or more of the Alertmanager instances within the same cluster
            are crashlooping.
        expr: |-
          (
            count by (namespace,service,cluster) (
              changes(process_start_time_seconds{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"}[10m]) > 4
            )
          /
            count by (namespace,service,cluster) (
              up{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"}
            )
          )
          >= 0.5
        for: 5m
        labels:
          severity: critical
      - alert: AlertmanagerClusterFailedPeers
        annotations:
          description: Alertmanager {{ $labels.namespace }}/{{ $labels.pod}} has {{
            $value }} failed peers in the {{$labels.job}} cluster.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclusterfailedpeers
          summary: An Alertmanager instance has failed peers in the cluster.
        expr: |-
          # Without max_over_time, failed scrapes could create false negatives, see
          # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
          max_over_time(alertmanager_cluster_failed_peers{job="prometheus-kube-prometheus-alertmanager",container="alertmanager",namespace="default"}[5m]) > 0
        for: 15m
        labels:
          severity: warning
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      meta.helm.sh/release-name: prometheus
      meta.helm.sh/release-namespace: default
    creationTimestamp: "2026-10-27T12:10:13Z"
    generation: 1
    labels:
      app: kube-prometheus-stack
      app.kubernetes.io/instance: prometheus
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/part-of: kube-prometheus-stack
      app.kubernetes.io/version: 92.14.0
      chart: kube-prometheus-stack-92.14.0
      heritage: Helm
      release: prometheus
    name: prometheus-kube-prometheus-config-reloaders
    namespace: default
    resourceVersion: "413066"
    uid: 7a393d24-bf9d-4e4b-ba31-f72d78e1562d
  spec:
    groups:
    - name: config-reloaders
      rules:
      - alert: ConfigReloaderSidecarErrors
        annotations:
          description: |-
            Errors encountered while the {{$labels.pod}} config-reloader sidecar attempts to sync config in {{$labels.namespace}} namespace.
            As a result, configuration for service running in {{$labels.pod}} may be stale and cannot be updated anymore.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/prometheus-operator/configreloadersidecarerrors
          summary: config-reloader sidecar has not had a successful reload for 10m
        expr: max_over_time(reloader_last_reload_successful{namespace=~".+"}[5m])
          == 0
        for: 10m
        labels:
          severity: warning
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      meta.helm.sh/release-name: prometheus
      meta.helm.sh/release-namespace: default
    creationTimestamp: "2026-10-27T12:10:13Z"
    generation: 1
    labels:
      app: kube-prometheus-stack
      app.kubernetes.io/instance: prometheus
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/part-of: kube-prometheus-stack
      app.kubernetes.io/version: 92.14.0
      chart: kube-prometheus-stack-92.14.0
      heritage: Helm
      release: prometheus
    name: prometheus-kube-prometheus-etcd
    namespace: default
    resourceVersion: "413069"
    uid: 1a0414c6-ef92-48f3-a154-6fda0d308ad5
  spec:
    groups:
    - name: etcd
      rules:
      - alert: etcdMembersDown
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": members are down ({{ $value
            }}).'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdmembersdown
          summary: etcd cluster members are down.
        expr: |-
          max without (endpoint) (
            sum without (instance, pod) (up{job=~".*etcd.*"} == bool 0)
          or
            count without (To) (
              sum without (instance, pod) (rate(etcd_network_peer_sent_failures_total{job=~".*etcd.*"}[120s])) > 0.01
            )
          )
          > 0
        for: 20m
        labels:
          severity: warning
      - alert: etcdInsufficientMembers
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": insufficient members ({{
            $value }}).'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdinsufficientmembers
          summary: etcd cluster has insufficient number of members.
        expr: sum(up{job=~".*etcd.*"} == bool 1) without (instance, pod) < ((count(up{job=~".*etcd.*"})
          without (instance, pod) + 1) / 2)
        for: 3m
        labels:
          severity: critical
      - alert: etcdNoLeader
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": member {{ $labels.instance
            }} has no leader.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdnoleader
          summary: etcd cluster has no leader.
        expr: etcd_server_has_leader{job=~".*etcd.*"} == 0
        for: 1m
        labels:
          severity: critical
      - alert: etcdHighNumberOfLeaderChanges
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": {{ $value }} leader changes
            within the last 15 minutes. Frequent elections may be a sign of insufficient
            resources, high network latency, or disruptions by other components and
            should be investigated.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighnumberofleaderchanges
          summary: etcd cluster has high number of leader changes.
        expr: increase((max without (instance, pod) (etcd_server_leader_changes_seen_total{job=~".*etcd.*"})
          or 0*absent(etcd_server_leader_changes_seen_total{job=~".*etcd.*"}))[15m:1m])
          >= 4
        for: 5m
        labels:
          severity: warning
      - alert: etcdHighNumberOfFailedGRPCRequests
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": {{ $value }}% of requests
            for {{ $labels.grpc_method }} failed on etcd instance {{ $labels.instance
            }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighnumberoffailedgrpcrequests
          summary: etcd cluster has high number of failed grpc requests.
        expr: |-
          100 * sum(rate(grpc_server_handled_total{job=~".*etcd.*", grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[5m])) without (grpc_type, grpc_code)
            /
          sum(rate(grpc_server_handled_total{job=~".*etcd.*"}[5m])) without (grpc_type, grpc_code)
            > 1
        for: 10m
        labels:
          severity: warning
      - alert: etcdHighNumberOfFailedGRPCRequests
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": {{ $value }}% of requests
            for {{ $labels.grpc_method }} failed on etcd instance {{ $labels.instance
            }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighnumberoffailedgrpcrequests
          summary: etcd cluster has high number of failed grpc requests.
        expr: |-
          100 * sum(rate(grpc_server_handled_total{job=~".*etcd.*", grpc_code=~"Unknown|FailedPrecondition|ResourceExhausted|Internal|Unavailable|DataLoss|DeadlineExceeded"}[5m])) without (grpc_type, grpc_code)
            /
          sum(rate(grpc_server_handled_total{job=~".*etcd.*"}[5m])) without (grpc_type, grpc_code)
            > 5
        for: 5m
        labels:
          severity: critical
      - alert: etcdGRPCRequestsSlow
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": 99th percentile of gRPC
            requests is {{ $value }}s on etcd instance {{ $labels.instance }} for
            {{ $labels.grpc_method }} method.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdgrpcrequestsslow
          summary: etcd grpc requests are slow
        expr: |-
          histogram_quantile(0.99, sum(rate(grpc_server_handling_seconds_bucket{job=~".*etcd.*", grpc_method!="Defragment", grpc_type="unary"}[5m])) without(grpc_type))
          > 0.15
        for: 10m
        labels:
          severity: critical
      - alert: etcdMemberCommunicationSlow
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": member communication with
            {{ $labels.To }} is taking {{ $value }}s on etcd instance {{ $labels.instance
            }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdmembercommunicationslow
          summary: etcd cluster member communication is slow.
        expr: |-
          histogram_quantile(0.99, rate(etcd_network_peer_round_trip_time_seconds_bucket{job=~".*etcd.*"}[5m]))
          > 0.15
        for: 10m
        labels:
          severity: warning
      - alert: etcdHighNumberOfFailedProposals
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": {{ $value }} proposal failures
            within the last 30 minutes on etcd instance {{ $labels.instance }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighnumberoffailedproposals
          summary: etcd cluster has high number of proposal failures.
        expr: rate(etcd_server_proposals_failed_total{job=~".*etcd.*"}[15m]) > 5
        for: 15m
        labels:
          severity: warning
      - alert: etcdHighFsyncDurations
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": 99th percentile fsync durations
            are {{ $value }}s on etcd instance {{ $labels.instance }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighfsyncdurations
          summary: etcd cluster 99th percentile fsync durations are too high.
        expr: |-
          histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{job=~".*etcd.*"}[5m]))
          > 0.5
        for: 10m
        labels:
          severity: warning
      - alert: etcdHighFsyncDurations
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": 99th percentile fsync durations
            are {{ $value }}s on etcd instance {{ $labels.instance }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighfsyncdurations
          summary: etcd cluster 99th percentile fsync durations are too high.
        expr: |-
          histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{job=~".*etcd.*"}[5m]))
          > 1
        for: 10m
        labels:
          severity: critical
      - alert: etcdHighCommitDurations
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": 99th percentile commit durations
            {{ $value }}s on etcd instance {{ $labels.instance }}.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdhighcommitdurations
          summary: etcd cluster 99th percentile commit durations are too high.
        expr: |-
          histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket{job=~".*etcd.*"}[5m]))
          > 0.25
        for: 10m
        labels:
          severity: warning
      - alert: etcdDatabaseQuotaLowSpace
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": database size exceeds the
            defined quota on etcd instance {{ $labels.instance }}, please defrag or
            increase the quota as the writes to etcd will be disabled when it is full.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcddatabasequotalowspace
          summary: etcd cluster database is running full.
        expr: (last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m])
          / last_over_time(etcd_server_quota_backend_bytes{job=~".*etcd.*"}[5m]))*100
          > 95
        for: 10m
        labels:
          severity: critical
      - alert: etcdExcessiveDatabaseGrowth
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": Predicting running out of
            disk space in the next four hours, based on write observations within
            the past four hours on etcd instance {{ $labels.instance }}, please check
            as it might be disruptive.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdexcessivedatabasegrowth
          summary: etcd cluster database growing very fast.
        expr: predict_linear(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[4h],
          4*60*60) > etcd_server_quota_backend_bytes{job=~".*etcd.*"}
        for: 10m
        labels:
          severity: warning
      - alert: etcdDatabaseHighFragmentationRatio
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": database size in use on
            instance {{ $labels.instance }} is {{ $value | humanizePercentage }} of
            the actual allocated disk space, please run defragmentation (e.g. etcdctl
            defrag) to retrieve the unused fragmented disk space.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcddatabasehighfragmentationratio
          summary: etcd database size in use is less than 50% of the actual allocated
            storage.
        expr: (last_over_time(etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"}[5m])
          / last_over_time(etcd_mvcc_db_total_size_in_bytes{job=~".*etcd.*"}[5m]))
          < 0.5 and etcd_mvcc_db_total_size_in_use_in_bytes{job=~".*etcd.*"} > 104857600
        for: 10m
        labels:
          severity: warning
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      meta.helm.sh/release-name: prometheus
      meta.helm.sh/release-namespace: default
    creationTimestamp: "2026-10-27T12:10:13Z"
    generation: 1
    labels:
      app: kube-prometheus-stack
      app.kubernetes.io/instance: prometheus
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/part-of: kube-prometheus-stack
      app.kubernetes.io/version: 92.14.0
      chart: kube-prometheus-stack-92.14.0
      heritage: Helm
      release: prometheus
    name: prometheus-kube-prometheus-general.rules
    namespace: default
    resourceVersion: "413064"
    uid: 94bf1c55-abf3-4b38-ba77-23347708751f
  spec:
    groups:
    - name: general.rules
      rules:
      - alert: TargetDown
        annotations:
          description: '{{ printf "%.4g" $value }}% of the {{ $labels.job }}/{{ $labels.service
            }} targets in {{ $labels.namespace }} namespace are down.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/targetdown
          summary: One or more targets are unreachable.
        expr: 100 * (count(up == 0) BY (cluster, job, namespace, service) / count(up)
          BY (cluster, job, namespace, service)) > 10
        for: 10m
        labels:
          severity: warning
      - alert: Watchdog
        annotations:
          description: |
            This is an alert meant to ensure that the entire alerting pipeline is functional.
            This alert is always firing, therefore it should always be firing in Alertmanager
            and always fire against a receiver. There are integrations with various notification
            mechanisms that send a notification when this alert is not firing. For example the
            "DeadMansSnitch" integration in PagerDuty.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/watchdog
          summary: An alert that should always be firing to certify that Alertmanager
            is working properly.
        expr: vector(1)
        labels:
          severity: none
      - alert: InfoInhibitor
        annotations:
          description: |
            This is an alert that is used to inhibit info alerts.
            By themselves, the info-level alerts are sometimes very noisy, but they are relevant when combined with
            other alerts.
            This alert fires whenever there's a severity="info" alert, and stops firing when another alert with a
            severity of 'warning' or 'critical' starts firing on the same namespace.
            This alert should be routed to a null receiver and configured to inhibit alerts with severity="info".
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/infoinhibitor
          summary: Info-level alert inhibition.
        expr: group by (namespace) (ALERTS{severity = "info"} == 1) unless on (namespace)
          group by (namespace) (ALERTS{alertname != "InfoInhibitor", alertstate =
          "firing", severity =~ "warning|critical"} == 1)
        labels:
          severity: none
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      meta.helm.sh/release-name: prometheus
      meta.helm.sh/release-namespace: default
    creationTimestamp: "2026-10-27T12:10:12Z"
    generation: 1
    labels:
      app: kube-prometheus-stack
      app.kubernetes.io/instance: prometheus
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/part-of: kube-prometheus-stack
      app.kubernetes.io/version: 92.14.0
      chart: kube-prometheus-stack-92.14.0
      heritage: Helm
      release: prometheus
    name: prometheus-kube-prometheus-k8s.rules.container-cpu-usage-second
    namespace: default
    resourceVersion: "413056"
    uid: 5ce010fb-9163-4075-839b-83f69f35c5bb
  spec:
    groups:
    - name: k8s.rules.container_cpu_usage_seconds_total
      rules:
      - expr: |-
          sum by (cluster, namespace, pod, container) (
            rate(container_cpu_usage_seconds_total{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}[5m])
          ) * on (cluster, namespace, pod) group_left(node) topk by (cluster, namespace, pod) (
            1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""})
          )
        record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m
      - expr: |-
          sum by (cluster, namespace, pod, container) (
            irate(container_cpu_usage_seconds_total{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}[5m])
          ) * on (cluster, namespace, pod) group_left(node) topk by (cluster, namespace, pod) (
            1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""})
          )
        record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
- apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata:
    annotations:
      meta.helm.sh/release-name: prometheus
      meta.helm.sh/release-namespace: default
    creationTimestamp: "2026-10-27T12:10:13Z"
    generation: 1
