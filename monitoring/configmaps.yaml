- apiVersion: v1
  data:
    send.py: |-
      import json, urllib.request, time
      now = time.time_ns()
      trace_id = "0123456789abcdef0123456789abcdef"
      span_id = "0123456789abcdef"
      payload = {
       "resourceSpans": [{
        "resource": {"attributes":[{"key":"service.name","value":{"stringValue":"robot-shop-trace-demo"}}]},
        "scopeSpans": [{
         "scope":{"name":"manual-otel-test"},
         "spans":[{
          "traceId":trace_id,"spanId":span_id,"name":"robot-shop-demo-request",
          "kind":1,"startTimeUnixNano":str(now-100000000),
          "endTimeUnixNano":str(now),
          "attributes":[{"key":"test.type","value":{"stringValue":"connectivity-verification"}}],
          "status":{"code":1}
         }]
        }]
       }]
      }
      req=urllib.request.Request("http://jaeger.monitoring.svc.cluster.local:4318/v1/traces",data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"},method="POST")
      r=urllib.request.urlopen(req,timeout=10)
      print("OTLP HTTP status:",r.status)
      print("Trace ID:",trace_id)
      print("Service: robot-shop-trace-demo")
