- apiVersion: v1
  data:
    fluent-bit.conf: |
      [SERVICE]
          Flush                 1
          Log_Level             info
          Parsers_File          /fluent-bit/etc/parsers.conf

      [INPUT]
          Name                  tail
          Path                  /var/log/containers/*_robot-shop_*.log
          Tag                   kube.*
          multiline.parser      cri
          Mem_Buf_Limit         5MB
          Skip_Long_Lines       On
          Refresh_Interval      5
          Read_from_Head        Off

      [FILTER]
          Name                  kubernetes
          Match                 kube.*
          Kube_Tag_Prefix       kube.var.log.containers.
          Merge_Log             On
          Keep_Log              On

      [OUTPUT]
          Name                  loki
          Match                 kube.*
          Host                  loki.monitoring.svc.cluster.local
          Port                  3100
          Labels                job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name']
          Line_Format           json
          Retry_Limit           False
  kind: ConfigMap
  metadata:
